<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090407">
<title>For Peaches ♡</title>
<style>
  :root {
    color-scheme: dark;
    --pink: #f6bfd0;
    --soft-pink: #f8dce5;
    --muted-pink: #d99aad;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    min-height: 100%;
    background: #000;
    overflow: hidden;
  }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: radial-gradient(ellipse at 50% 42%, #160b11 0%, #080407 52%, #000 100%);
  }
  canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: pointer;
  }
  .intro, .wish, .replay {
    position: fixed;
    z-index: 2;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.8s ease, transform 1.8s ease;
  }
  .intro {
    top: clamp(22px, 5vh, 54px);
    left: 16px;
    right: 16px;
    text-align: center;
    transform: translateY(-10px);
  }
  .eyebrow {
    margin: 0 0 8px;
    color: #d9a8b7;
    font: 10px/1.4 Arial, sans-serif;
    letter-spacing: .34em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0;
    color: var(--soft-pink);
    font-size: clamp(34px, 6vw, 68px);
    line-height: 1.05;
    font-weight: 400;
    letter-spacing: .015em;
    text-shadow: 0 0 24px rgba(242, 160, 187, .22);
  }
  h1 span { color: var(--pink); font-style: italic; }
  .wish {
    left: 50%;
    bottom: clamp(24px, 5vh, 52px);
    width: min( min(560px, calc(100vw - 34px)), 90vw );
    padding: 17px 22px 15px;
    border: 1px solid rgba(238, 174, 194, .24);
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(31, 12, 22, .82), rgba(13, 7, 11, .76));
    box-shadow: 0 12px 50px rgba(0, 0, 0, .34), 0 0 35px rgba(219, 130, 160, .08);
    text-align: center;
    transform: translate(-50%, 12px);
    backdrop-filter: blur(8px);
  }
  .wish p {
    margin: 0;
    color: #f4dce4;
    font-size: clamp(14px, 2vw, 17px);
    line-height: 1.65;
  }
  .wish .signoff {
    margin-top: 8px;
    color: #e8aabd;
    font-size: 13px;
    font-style: italic;
  }
  .replay {
    right: 18px;
    bottom: 17px;
    z-index: 3;
    border: 1px solid rgba(238, 174, 194, .28);
    border-radius: 999px;
    padding: 8px 13px;
    color: #f3cbd7;
    background: rgba(18, 8, 13, .82);
    font: 11px Arial, sans-serif;
    letter-spacing: .08em;
    cursor: pointer;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .revealed .intro, .revealed .wish, .revealed .replay {
    opacity: 1;
  }
  .revealed .replay { pointer-events: auto; }
  .revealed .intro { transform: translateY(0); }
  .revealed .wish { transform: translate(-50%, 0); }
  @media (max-height: 650px) {
    .intro { top: 14px; }
    h1 { font-size: clamp(29px, 5vw, 48px); }
    .wish { bottom: 12px; padding: 10px 16px; }
    .wish p { font-size: 13px; line-height: 1.45; }
    .wish .signoff { margin-top: 4px; }
  }
  @media (max-width: 480px) {
    .wish { width: calc(100vw - 28px); padding: 13px 16px; }
    .wish p { font-size: 13px; }
    .replay { right: 12px; bottom: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .intro, .wish, .replay { transition-duration: .01ms; }
  }
</style>
</head>
<body>
<canvas id="screen" aria-label="An animated ASCII bouquet of pink lilies"></canvas>

<header class="intro" aria-live="polite">
  <p class="eyebrow">a little garden, just for you</p>
  <h1>Happy Birthday, <span>Peaches</span> ♡</h1>
</header>

<section class="wish" aria-label="Birthday message">
  <p>Hope your day is as sweet, lovely, and wonderful as you are. You deserve all the happiness, all the hugs, and a whole garden of beautiful little moments. Keep being your adorable self. ♡</p>
  <p class="signoff">Sending you the biggest birthday hug!</p>
</section>

<button class="replay" id="replay" type="button">↻ &nbsp; REPLAY FLOWERS</button>
<script src="bouquet.js"></script>
<script>
  document.getElementById('replay').addEventListener('click', (event) => {
    event.stopPropagation();
    // The bouquet script also listens for R, Space, or a canvas click.
    window.dispatchEvent(new KeyboardEvent('keydown', { key: 'r' }));
  });
</script>
</body>
</html>
